[package]
name = "herculean-desktop"
version = "0.1.0"
description = "Herculean Desktop - Run AI assistants locally with Docker"
authors = ["Herculean AI <team@herculean.ai>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Herculean-AI/DOWNLOAD_ASSISTANT"

[lib]
name = "herculean_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
dirs = "5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
